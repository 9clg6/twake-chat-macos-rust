[workspace]
members = ["crates/*", "xtask"]
exclude = ["vendor"]
resolver = "3"

[patch.crates-io]
# SQLite 3.54.1 sources in libsqlite3-sys 0.38.2 (RUSTSEC-2026-0459, A025). Drop at rusqlite >= 0.41.
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
cognitive_complexity = "warn"
too_many_lines = "warn"

[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release-fast]
inherits = "release"
lto = "off"
