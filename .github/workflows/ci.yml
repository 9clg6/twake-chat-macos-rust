name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Linux system libraries for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libvulkan-dev libfontconfig1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.7.7
      - uses: taiki-e/install-action@v2.49.17
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo nextest run --locked --workspace --no-tests=pass
      - if: runner.os == 'Linux'
        run: cargo deny check
      - run: cargo audit
      - run: cargo build --locked --workspace
      - run: cargo run --locked -p xtask -- tokens --check
      - run: cargo run --locked -p xtask -- icons --check
