[package]
name = "twake-matrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "rustls-aws-lc-rs"] }
matrix-sdk-ui = { version = "=0.19.1", default-features = false, features = ["rustls-aws-lc-rs"] }
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
twake-app = { path = "../twake-app" }
twake-domain = { path = "../twake-domain" }

[dev-dependencies]
# `testing` brings MatrixMockServer (wiremock, matrix-sdk-test): an in-process mock homeserver, no network.
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "rustls-aws-lc-rs", "testing"] }
wiremock = { version = "0.6.5", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "time"] }
futures = "0.3"
tempfile = "3"
serde_json = "1"
