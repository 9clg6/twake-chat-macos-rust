[package]
name = "twake-ui-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
twake-gpui = { path = "../twake-gpui" }
twake-tokens = { path = "../twake-tokens" }
twake-icons = { path = "../twake-icons" }
twake-domain = { path = "../twake-domain" }
unicode-segmentation = "1"

[dev-dependencies]
proptest = "1"
sha2 = "0.10"
ttf-parser = "0.25"

# `current_platform` needs the main thread: this target runs its own `main`.
[[test]]
name = "fonts_text_system"
harness = false
