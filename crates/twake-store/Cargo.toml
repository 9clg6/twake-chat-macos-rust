[package]
name = "twake-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
twake-app = { path = "../twake-app" }
twake-domain = { path = "../twake-domain" }
futures = "0.3"
thiserror = "2.0.21"
getrandom = "0.3"
keyring-core = "1.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
twake-testing = { path = "../twake-testing" }
uuid = { version = "1", features = ["v4"] }
